{% extends "base.html" %}
{% block titulo %}Error {{ error.code }}{% endblock %}
{% block contenido %}
<div class="pagina-error">
  <div class="pagina-error__codigo">{{ error.code }}</div>
  <h1 class="h3 mt-2">{{ error.name }}</h1>
  <p class="text-secondary" style="max-width: 480px; margin: 0.5rem auto 1.5rem;">{{ error.description }}</p>
  <a class="btn btn-primary btn-lg" href="{{ url_for('dashboard.index') }}"><i class="bi bi-house-door-fill me-1"></i>Ir al inicio</a>
</div>
{% endblock %}
