<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión · Sandía</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #FDF6EE; color: #212121; font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      text-align: center; padding: 24px;
    }
    .tarjeta { max-width: 420px; }
    img { width: 96px; height: 96px; margin-bottom: 16px; }
    h1 { font-family: 'Fredoka', system-ui, sans-serif; color: #E53935; font-size: 1.6rem; margin: 0 0 8px; }
    p { color: #4B5563; margin: 0 0 20px; line-height: 1.5; }
    button {
      background: #E53935; color: #fff; border: none; border-radius: .6rem;
      padding: 12px 24px; font-weight: 700; font-size: 1rem; min-height: 44px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <img src="/static/img/logo.svg" alt="">
    <h1>Sin conexión a internet</h1>
    <p>No se pudo cargar esta página porque no hay conexión. Algunas páginas que ya visitaste pueden seguir disponibles; los datos nuevos se sincronizarán cuando vuelva la señal.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
