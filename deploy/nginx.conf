# /etc/nginx/sites-available/vetcare
# Reemplaza ⟨dominio⟩ por el dominio real (ej. clinica.example.com) antes de usar.

server {
    listen 80;
    server_name ⟨dominio⟩;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ⟨dominio⟩;

    # Let's Encrypt (certbot --nginx los agrega/gestiona automáticamente)
    ssl_certificate     /etc/letsencrypt/live/⟨dominio⟩/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/⟨dominio⟩/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/vetcare/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://unix:/var/www/vetcare/vetcare.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
